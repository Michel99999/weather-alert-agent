name: Vérifier la météo et envoyer une alerte

on:
  schedule:
    # Exécute tous les jours à 08:00 (heure de Paris = UTC+2)
    - cron: '0 6 * * *'  # 06:00 UTC = 08:00 UTC+2
  workflow_dispatch:  # Permet de lancer manuellement depuis GitHub

jobs:
  check_weather:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout le dépôt
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Exécuter le script
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python weather_alert.py